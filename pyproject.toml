[project]
name = "sbc"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "clipspy>=1.0.6",
    "matplotlib>=3.11.2",
    "rdflib>=7.6.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
